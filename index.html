    <script>
    /* Atualização de interface: não limpa dados, cookies ou armazenamento local. */
    (() => {
      const currentBuild = '256';
      let checking = false;
      let lastReload = 0;
      async function checkForUpdate() {
        if (checking || document.visibilityState !== 'visible') return;
        checking = true;
        try {
          const res = await fetch('./nexodent-version.json?t=' + Date.now(), {
            cache: 'no-store', credentials: 'same-origin'
          });
          if (!res.ok) return;
          const info = await res.json();
          if (!info || typeof info.build !== 'string' || info.build === currentBuild) return;
          // Evita interromper digitação ou formulários em edição.
          const focused = document.activeElement;
          const editing = focused && (focused.matches('input, textarea, select, [contenteditable="true"]'));
          if (editing || Date.now() - lastReload < 60000) return;
          lastReload = Date.now();
          const url = new URL(location.href);
          url.searchParams.set('nexodent_build', info.build);
          location.replace(url.href);
        } catch (_) { /* Sem rede: continuar funcionando normalmente. */ }
        finally { checking = false; }
      }
      window.addEventListener('pageshow', checkForUpdate);
      document.addEventListener('visibilitychange', () => { if (!document.hidden) checkForUpdate(); });
      window.addEventListener('focus', checkForUpdate);
      setInterval(checkForUpdate, 120000);
    })();
    </script>
