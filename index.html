    <script>
    /* Atualização segura do PWA: sem apagar dados locais nem forçar recarga durante edição. */
    (() => {
      const build = '259';
      let pending = false;
      let busy = false;
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.id = 'nexodent-refresh-button';
      btn.textContent = '↻';
      btn.title = 'Verificar atualização do NexoDent';
      btn.setAttribute('aria-label', 'Verificar atualização do NexoDent');
      // Botão discreto, exclusivo de celular, dentro do cabeçalho ao lado de Sair.
      Object.assign(btn.style, {width:'28px',height:'28px',minWidth:'28px',
        borderRadius:'6px',border:'none',background:'transparent',color:'#e66b18',
        boxShadow:'none',fontSize:'22px',lineHeight:'28px',padding:'0',cursor:'pointer',
        display:'none',flex:'0 0 auto'});
      const mobile = window.matchMedia('(max-width: 767px)');
      function positionRefresh() {
        const icons = document.querySelector('.ov-top .ov-top-icons');
        if (!icons) { btn.remove(); return; }
        if (btn.parentElement !== icons) icons.insertBefore(btn, icons.querySelector('.ov-sair'));
        btn.style.display = mobile.matches ? 'inline-flex' : 'none';
        btn.style.alignItems = 'center'; btn.style.justifyContent = 'center';
      }
      let scheduled=false;
      const observer=new MutationObserver(()=>{
        if(scheduled)return;
        scheduled=true;
        requestAnimationFrame(()=>{scheduled=false;positionRefresh();});
      });
      observer.observe(document.getElementById('app')||document.body,{childList:true,subtree:true});
      mobile.addEventListener?.('change',positionRefresh);
      positionRefresh();
      const banner = document.createElement('div');
      banner.id = 'nexodent-update-banner';
      banner.setAttribute('role','status');
      Object.assign(banner.style,{display:'none',position:'fixed',left:'12px',right:'12px',bottom:'66px',
        zIndex:'2147483000',background:'#fff7ed',color:'#7c2d12',border:'1px solid #fdba74',
        padding:'12px',borderRadius:'10px',font:'14px system-ui',boxShadow:'0 3px 15px #0002'});
      banner.textContent = 'Nova versão disponível. Salve suas alterações antes de atualizar. ';
      const update = document.createElement('button');
      update.type='button'; update.textContent='Atualizar agora';
      Object.assign(update.style,{marginLeft:'8px',background:'#ea580c',color:'#fff',border:0,
        borderRadius:'6px',padding:'8px',cursor:'pointer'});
      banner.appendChild(update); document.body.appendChild(banner);
      function editing() {
        const el=document.activeElement;
        return el && el.matches && el.matches('input,textarea,select,[contenteditable], [role="textbox"]');
      }
      function reload() {
        if (editing() && !confirm('Você pode ter alterações não salvas. Atualizar mesmo assim?')) return;
        const u=new URL(location.href);
        u.searchParams.set('nexodent_build',String(Date.now()));
        location.replace(u.href);
      }
      update.addEventListener('click',reload);
      async function check(manual=false) {
        if (busy) return;
        busy=true;
        try {
          const response=await fetch('./nexodent-version.json?_='+Date.now(),{cache:'no-store'});
          if (!response.ok) throw Error('Versão indisponível');
          const data=await response.json();
          pending=String(data.build||'')!==build;
          banner.style.display=pending?'block':'none';
          if (manual && !pending) {
            // Recarregar também permite buscar conteúdo atualizado quando o JSON não foi publicado.
            if(confirm('Nenhuma nova versão foi identificada. Deseja recarregar a página?')) reload();
          }
        } catch(e) {
          if(manual && confirm('Não foi possível verificar a versão. Recarregar a página?')) reload();
        } finally {busy=false;}
      }
      // Puxar para atualizar no PWA: apenas quando a rolagem principal está no topo.
      // Não bloqueia o gesto nativo nem interfere com listas e modais roláveis.
      const pull = document.createElement('div');
      pull.setAttribute('role','status');
      pull.setAttribute('aria-live','polite');
      pull.textContent = '↓ Puxe para atualizar';
      Object.assign(pull.style, {position:'fixed',top:'max(8px, env(safe-area-inset-top))',
        left:'50%',transform:'translate(-50%, -130%)',transition:'transform .16s ease',
        zIndex:'2147483000',padding:'7px 12px',borderRadius:'20px',background:'#fff',
        color:'#e66b18',boxShadow:'0 2px 9px #0002',font:'12px system-ui',
        pointerEvents:'none',opacity:'0'});
      document.body.appendChild(pull);
      let startY=0,startX=0,tracking=false,armed=false;
      function atTop(target) {
        if (window.scrollY > 2 || document.documentElement.scrollTop > 2 || document.body.scrollTop > 2) return false;
        for(let node=target; node && node!==document.body; node=node.parentElement) {
          if (node.scrollTop > 2) return false;
        }
        return true;
      }
      function resetPull() {
        tracking=false;armed=false;
        pull.style.transform='translate(-50%, -130%)';pull.style.opacity='0';
      }
      document.addEventListener('touchstart',e=>{
        if(!mobile.matches || e.touches.length!==1 || !atTop(e.target) || editing()) {resetPull();return;}
        startY=e.touches[0].clientY;startX=e.touches[0].clientX;
        tracking=true;armed=false;
      },{passive:true});
      document.addEventListener('touchmove',e=>{
        if(!tracking || e.touches.length!==1) return;
        const dy=e.touches[0].clientY-startY;
        const dx=Math.abs(e.touches[0].clientX-startX);
        if(dy<0 || dx>Math.max(24,dy)) {resetPull();return;}
        if(!atTop(e.target)) {resetPull();return;}
        armed=dy>=85;
        if(dy>15){
          pull.textContent=armed?'↻ Solte para atualizar':'↓ Puxe para atualizar';
          pull.style.opacity='1';
          pull.style.transform='translate(-50%, '+Math.min(18, -25+dy*.45)+'px)';
        }
      },{passive:true});
      document.addEventListener('touchend',()=>{
        const shouldReload=tracking && armed;
        resetPull();
        if(shouldReload) reload();
      },{passive:true});
      document.addEventListener('touchcancel',resetPull,{passive:true});
      btn.addEventListener('click',()=>check(true));
      window.addEventListener('pageshow',()=>check());
      document.addEventListener('visibilitychange',()=>{if(!document.hidden)check();});
      setInterval(()=>{if(!document.hidden)check();},120000);
    })();
    </script>
