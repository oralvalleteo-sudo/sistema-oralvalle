<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Conexão WhatsApp | NexoDent</title><style>:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#242b35;background:#f8f9fb}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px}.box{width:min(100%,490px);background:#fff;border:1px solid #e2e6ec;border-radius:18px;padding:32px;box-shadow:0 12px 35px #16212b0b}h1{font-size:23px;margin:0 0 12px}p{line-height:1.6;color:#536070}a{display:inline-block;margin-top:12px;background:#f46a0b;color:white;text-decoration:none;border-radius:10px;padding:12px 16px;font-weight:650}.note{font-size:13px}</style></head><body><main class="box"><h1>Conexão WhatsApp — NexoDent</h1><p id="message" role="status">Estamos preparando a integração oficial do WhatsApp. A conexão ainda não foi concluída.</p><p class="note">Nenhuma conta será considerada conectada até que a autorização seja validada com segurança no servidor.</p><a href="./integracoes/">Voltar às integrações</a></main><script>/* Não processar tokens, códigos ou estados OAuth no navegador. */(function(){const q=new URLSearchParams(location.search);if(q.has('error')||q.has('error_reason'))document.getElementById('message').textContent='A autorização não foi concluída. Retorne às integrações para tentar novamente quando o serviço estiver disponível.';if(location.search||location.hash)history.replaceState(null,'',location.pathname);})();</script></body></html>
