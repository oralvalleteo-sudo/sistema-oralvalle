name: Publicar página estática

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/quality.yml
  publish:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Separar somente os arquivos públicos
        run: |
          mkdir _site
          cp index.html _site/
          cp nexodent-version.json sw.js manifest.webmanifest _site/
          cp apple-touch-icon.png icon-192.png icon-512.png _site/
          cp -R assets _site/assets
          cp -R admin _site/admin
          cp -R integracoes _site/integracoes
          cp -R crm _site/crm
          cp -R assinatura _site/assinatura
          cp -R comunicacao _site/comunicacao
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4