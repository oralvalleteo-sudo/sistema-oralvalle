name: Publicar página estática

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Conferir CSS inicial gerado
        run: |
          python3 scripts/build_shell_css.py
          git diff --exit-code -- assets/css/app-shell.css
      - run: npm ci --ignore-scripts
      - name: Testar proteção dos backups
        run: |
          python3 -m pip install --disable-pip-version-check 'psycopg[binary]==3.2.9'
          python3 -m unittest discover -s tests/python -v
      - name: Testar funcionalidades e proteção no banco isolado
        run: npm test
        env:
          PGLITE_MODULE: '@electric-sql/pglite'
      - name: Preparar Chromium
        run: npx playwright install --with-deps chromium
      - name: Informar caminho do Chromium
        run: node -e "require('fs').appendFileSync(process.env.GITHUB_ENV,'CHROMIUM_BIN='+require('playwright').chromium.executablePath()+'\n')"
      - name: Reproduzir os fluxos no navegador
        run: npm run test:browser
        env:
          PGLITE_MODULE: '@electric-sql/pglite'
  publish:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Separar somente os arquivos públicos
        run: python3 scripts/package_pages.py
      - name: Verificar CRM e recursos publicados
        run: python3 scripts/check_pages.py _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
